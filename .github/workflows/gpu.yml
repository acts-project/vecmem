# Name for this "action".
name: GPU Tests

# Perform the builds/tests on every push and pull request.
on: [ push, pull_request ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:

  # Build the GPU code on a "regular" runner, and hand the build directory
  # over to the GPU runner for the actual test execution.
  build:

    strategy:
      fail-fast: false
      matrix:
        PLATFORM:
          - NAME: "CUDA"
            CONTAINER: "ghcr.io/acts-project/ubuntu2004_cuda:51"
            OPTIONS:
          - NAME: "SYCL"
            # Note that tags before ":48" do not come with the CodePlay NVIDIA
            # plugin, and can therefore not run SYCL code on an NVIDIA GPU.
            CONTAINER: "ghcr.io/acts-project/ubuntu2004_cuda_oneapi:51"
            OPTIONS: -DVECMEM_BUILD_CUDA_LIBRARY=FALSE

    name: "build (${{ matrix.PLATFORM.NAME }})"

    runs-on: ubuntu-latest
    container: ${{ matrix.PLATFORM.CONTAINER }}

    # Hack to continue using checkout (for now) on the older images.
    # see: https://github.blog/changelog/2024-03-07-github-actions-all-actions-will-run-on-node20-instead-of-node16-by-default/
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    # Use BASH as the shell from the image.
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4
    # Run the CMake configuration.
    - name: Configure
      run: |
        source ${GITHUB_WORKSPACE}/.github/ci_setup.sh ${{ matrix.PLATFORM.NAME }}
        cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DVECMEM_BUILD_${{ matrix.PLATFORM.NAME }}_LIBRARY=TRUE \
          -DVECMEM_BUILD_BENCHMARKING=TRUE \
          ${{ matrix.PLATFORM.OPTIONS }} \
          -S ${GITHUB_WORKSPACE} \
          -B build
    # Perform the build.
    - name: Build
      run: |
        source ${GITHUB_WORKSPACE}/.github/ci_setup.sh ${{ matrix.PLATFORM.NAME }}
        cmake --build build
    # Pack the build directory into a tarball. (Artifact up-/download does not
    # preserve file permissions, which the test executables need.)
    - name: Pack
      run: tar czf build.tar.gz build
    - uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.PLATFORM.NAME }}
        path: build.tar.gz
        retention-days: 1
        compression-level: 0

  # Run the tests needing a GPU on a self-hosted machine with an NVIDIA GPU.
  test:

    strategy:
      fail-fast: false
      matrix:
        PLATFORM:
          - NAME: "CUDA"
            CONTAINER: "ghcr.io/acts-project/ubuntu2004_cuda:51"
            CTEST_REGEX: ".*cuda.*"
            DEVICE_SELECTOR:
          - NAME: "SYCL"
            # Note that tags before ":48" do not come with the CodePlay NVIDIA
            # plugin, and can therefore not run SYCL code on an NVIDIA GPU.
            CONTAINER: "ghcr.io/acts-project/ubuntu2004_cuda_oneapi:51"
            CTEST_REGEX: ".*sycl.*"
            DEVICE_SELECTOR: "cuda:gpu"

    name: "test (${{ matrix.PLATFORM.NAME }})"

    needs: build

    runs-on: [ gpu-nvidia, self-hosted ]
    container:
      image: ${{ matrix.PLATFORM.CONTAINER }}
      options: --gpus all

    # Give the job a hard limit, so that a hanging test or benchmark would not
    # occupy the (single) GPU machine indefinitely.
    timeout-minutes: 30

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      # Pick the GPU for the SYCL jobs. (ci_setup.sh would default to the CPU.)
      ONEAPI_DEVICE_SELECTOR: ${{ matrix.PLATFORM.DEVICE_SELECTOR }}

    defaults:
      run:
        shell: bash

    steps:
    # The source tree needs to be in the same place as during the build, since
    # the CMake/CTest configuration refers to it with absolute paths.
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: build-${{ matrix.PLATFORM.NAME }}
    - name: Unpack
      run: tar xzf build.tar.gz
    # Show what the runner is offering.
    - name: Device info
      run: |
        source ${GITHUB_WORKSPACE}/.github/ci_setup.sh ${{ matrix.PLATFORM.NAME }}
        nvidia-smi
        if command -v sycl-ls >/dev/null 2>&1; then
          # Unset the device selector, to see all the available backends, and
          # not just the one that the tests would use.
          env -u ONEAPI_DEVICE_SELECTOR sycl-ls
        fi
    # Run the unit test(s).
    - name: Test
      run: |
        cd build
        source ${GITHUB_WORKSPACE}/.github/ci_setup.sh ${{ matrix.PLATFORM.NAME }}
        ctest --output-on-failure -R "${{ matrix.PLATFORM.CTEST_REGEX }}"
    # Run the benchmark(s) on the GPU. The measurement time is cut short on
    # purpose. The goal here is to exercise the benchmark code on a real device,
    # not to produce meaningful numbers on a machine shared with other jobs.
    - name: Benchmark
      env:
        PLATFORM_NAME: ${{ matrix.PLATFORM.NAME }}
      run: |
        source ${GITHUB_WORKSPACE}/.github/ci_setup.sh ${PLATFORM_NAME}
        BENCHMARK="./build/bin/vecmem_benchmark_$(echo ${PLATFORM_NAME} | tr '[:upper:]' '[:lower:]')"
        # Make the failure explicit if the executable was renamed, instead of
        # letting the shell fail with a much less obvious error.
        if [ ! -x "${BENCHMARK}" ]; then
           echo "Benchmark executable \"${BENCHMARK}\" not found!"
           exit 1
        fi
        ${BENCHMARK} --benchmark_min_time=0.01
